{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>Patients</h1><a class="btn btn-primary" href="{{ url_for('new_patient') }}">New patient</a></div><table class="table table-hover"><tr><th>Identifier</th><th>Name</th><th>Sex</th><th></th></tr>{% for patient in patients %}<tr><td>{{ patient.demo_identifier }}</td><td>{{ patient.full_name }}</td><td>{{ patient.sex }}</td><td><a href="{{ url_for('patient_detail', patient_id=patient.patient_id) }}">View</a></td></tr>{% else %}<tr><td colspan="4">No patients.</td></tr>{% endfor %}</table>{% endblock %}
