{% extends "base.html" %}{% block content %}<h1>Health record for {{ patient.demo_identifier }}</h1><p class="text-muted">Leave optional measurements blank to preserve missingness.</p><form method="post" class="row g-3"><div class="col-md-4"><label>Age</label><input class="form-control" type="number" name="age" required min="18" max="120"></div>{% for field,label in [('bmi','BMI'),('glucose','Blood glucose'),('blood_pressure','Blood pressure')] %}<div class="col-md-4"><label>{{ label }}</label><input class="form-control" type="number" step="0.1" name="{{ field }}"></div>{% endfor %}<div class="col-md-4"><label>Physical activity</label><select class="form-select" name="physical_activity"><option value="">Missing</option><option>Low</option><option>Moderate</option><option>High</option></select></div><div class="col-md-4"><label>Smoking status</label><select class="form-select" name="smoking_status"><option value="">Missing</option><option>Never</option><option>Former</option><option>Current</option></select></div><div><button class="btn btn-primary">Save record</button></div></form>{% endblock %}
