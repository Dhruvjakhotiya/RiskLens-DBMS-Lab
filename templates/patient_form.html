{% extends "base.html" %}{% block content %}<h1>{{ 'Edit' if patient else 'Register' }} patient</h1><form method="post" class="row g-3"><div class="col-md-6"><label>Demo identifier</label><input class="form-control" name="demo_identifier" value="{{ patient.demo_identifier if patient else '' }}" required></div><div class="col-md-6"><label>Name</label><input class="form-control" name="full_name" value="{{ patient.full_name if patient else '' }}" required></div><div class="col-md-6"><label>Date of birth</label><input type="date" class="form-control" name="date_of_birth" value="{{ patient.date_of_birth if patient else '' }}" required></div><div class="col-md-6"><label>Sex</label><select class="form-select" name="sex" required>{% for option in ['Female','Male','Other','Prefer not to say'] %}<option>{{ option }}</option>{% endfor %}</select></div><div><button class="btn btn-primary">Save</button></div></form>{% endblock %}
